<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table Export iframe demo</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; }
  iframe { width: 100%; height: 170px; border: 1px dashed #999; }
</style>
</head>
<body>
<h1>Tables inside iframes</h1>
<p>Serve this folder on <code>localhost</code>. The third frame then loads from <code>127.0.0.1</code>, which is a different origin. The extension asks for access before it can read that frame.</p>

<h2>Same-origin iframe</h2>
<iframe id="same" src="frame-table.html"></iframe>

<h2>srcdoc iframe</h2>
<iframe id="srcdoc" srcdoc="<table><tr><th>Key</th><th>Value</th></tr><tr><td>alpha</td><td>1</td></tr></table>"></iframe>

<h2>Cross-origin iframe</h2>
<iframe id="cross"></iframe>
<script>
  // Same server, different hostname = different origin.
  const url = new URL('frame-table.html', location.href);
  url.hostname = url.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
  document.getElementById('cross').src = url.href;
</script>
</body>
</html>
