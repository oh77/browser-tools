<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Framed table</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 8px; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #aaa; padding: 3px 8px; }
</style>
</head>
<body>
<table id="framed">
  <caption>Framed prices</caption>
  <thead><tr><th>Product</th><th>Price</th></tr></thead>
  <tbody>
    <tr><td>Apple</td><td>1.20</td></tr>
    <tr><td>Pear</td><td>0.95</td></tr>
  </tbody>
</table>
</body>
</html>
